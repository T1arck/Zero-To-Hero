{% extends "base.html" %}
{% block content %}
<div style="max-width:640px;margin:24px auto;">
  <div class="card">
    <h1 style="font-size:24px;margin-bottom:24px;">Новая заявка на проект</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      <div class="form-group">
        <label>Заголовок</label>
        {{ form.title(class="form-control") }}
      </div>
      <div class="form-group">
        <label>Описание задачи</label>
        {{ form.description(class="form-control") }}
      </div>
      <div class="form-group">
        <label>Бюджет (руб.)</label>
        {{ form.budget(class="form-control") }}
      </div>
      <button class="btn btn-primary" type="submit">Опубликовать заявку</button>
    </form>
  </div>
</div>
{% endblock %}
ENDOFFILE
